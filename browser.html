<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ニュース</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">

<style>
.msym{visibility:hidden}
:root[data-icons="on"] .msym{visibility:visible}
</style>
</head>
<body>
<style>
:root{
  --surface:#ffffff;
  --surface-dim:#f8fafd;
  --surface-container:#f0f4f9;
  --surface-container-high:#e9eef6;
  --surface-container-highest:#dde3ea;
  --on-surface:#1f1f1f;
  --on-surface-variant:#444746;
  --on-surface-faint:#5f6368;
  --outline-variant:#dde3ea;
  --primary:#0b57d0;
  --on-primary:#ffffff;
  --primary-container:#d3e3fd;
  --on-primary-container:#041e49;
  --secondary-container:#c2e7ff;
  --on-secondary-container:#001d35;
  --error:#b3261e;
  --scrim:rgba(0,0,0,.32);
  --elev1:0 1px 2px rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15);
  --elev2:0 1px 2px rgba(0,0,0,.30), 0 2px 6px 2px rgba(0,0,0,.15);
  --ripple:rgba(31,31,31,.08);
  --logo-invert:0;
  --uni-accent:#1b4c8c;
  --uni-band:#f3f5f8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#131314;
    --surface-dim:#131314;
    --surface-container:#1e1f20;
    --surface-container-high:#282a2c;
    --surface-container-highest:#333537;
    --on-surface:#e3e3e3;
    --on-surface-variant:#c4c7c5;
    --on-surface-faint:#9aa0a6;
    --outline-variant:#444746;
    --primary:#a8c7fa;
    --on-primary:#062e6f;
    --primary-container:#0842a0;
    --on-primary-container:#d3e3fd;
    --secondary-container:#004a77;
    --on-secondary-container:#c2e7ff;
    --error:#f2b8b5;
    --scrim:rgba(0,0,0,.55);
    --elev1:0 1px 2px rgba(0,0,0,.55), 0 1px 3px 1px rgba(0,0,0,.30);
    --elev2:0 1px 2px rgba(0,0,0,.55), 0 2px 6px 2px rgba(0,0,0,.30);
    --ripple:rgba(227,227,227,.10);
    --logo-invert:1;
    --uni-accent:#a8c7fa;
    --uni-band:#1e1f20;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface:#131314;
  --surface-dim:#131314;
  --surface-container:#1e1f20;
  --surface-container-high:#282a2c;
  --surface-container-highest:#333537;
  --on-surface:#e3e3e3;
  --on-surface-variant:#c4c7c5;
  --on-surface-faint:#9aa0a6;
  --outline-variant:#444746;
  --primary:#a8c7fa;
  --on-primary:#062e6f;
  --primary-container:#0842a0;
  --on-primary-container:#d3e3fd;
  --secondary-container:#004a77;
  --on-secondary-container:#c2e7ff;
  --error:#f2b8b5;
  --scrim:rgba(0,0,0,.55);
  --elev1:0 1px 2px rgba(0,0,0,.55), 0 1px 3px 1px rgba(0,0,0,.30);
  --elev2:0 1px 2px rgba(0,0,0,.55), 0 2px 6px 2px rgba(0,0,0,.30);
  --ripple:rgba(227,227,227,.10);
  --logo-invert:1;
  --uni-accent:#a8c7fa;
  --uni-band:#1e1f20;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--surface);color:var(--on-surface);
  font-family:'Roboto','Noto Sans JP',system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.msym{
  font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;
  font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;
  display:inline-block;white-space:nowrap;direction:ltr;
  -webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;
  user-select:none;
}

/* ---------- shell ---------- */
#app{
  min-height:100dvh;display:flex;flex-direction:column;
  background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom);
}
.view{display:none;flex-direction:column;flex:1}
.view.on{display:flex}

/* ---------- app bar ---------- */
.appbar{
  position:sticky;top:0;z-index:20;background:var(--surface);
  padding:8px 8px 0;
}
.searchbar{
  display:flex;align-items:center;gap:12px;
  height:48px;border-radius:24px;background:var(--surface-container);
  padding:0 6px 0 16px;width:100%;text-align:left;
  transition:background .15s;
}
.searchbar:hover{background:var(--surface-container-high)}
.searchbar .msym{color:var(--on-surface-variant);font-size:22px}
.searchbar span.ph{flex:1;color:var(--on-surface-variant);font-size:15px}
.avatar{
  width:32px;height:32px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,#5e97f6,#2b6cd4);
  color:#fff;font-size:14px;font-weight:500;
  display:grid;place-items:center;
}

/* ---------- tabs ---------- */
.tabs{
  position:sticky;top:56px;z-index:19;background:var(--surface);
  display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--outline-variant);
  padding:0 4px;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;padding:14px 16px 12px;font-size:14px;font-weight:500;
  color:var(--on-surface-variant);position:relative;white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--primary)}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;
  background:var(--primary);border-radius:3px 3px 0 0;
}

/* ---------- feed ---------- */
main{flex:1;padding:12px 8px 88px;background:var(--surface)}
.feedgrid{display:grid;gap:12px;grid-template-columns:1fr;max-width:1120px;margin:0 auto}
@media (min-width:720px){.feedgrid{grid-template-columns:1fr 1fr;align-items:start}}
@media (min-width:1080px){.feedgrid{grid-template-columns:1fr 1fr 1fr}}

.sectionhead{
  grid-column:1/-1;display:flex;align-items:center;gap:8px;
  padding:12px 8px 4px;color:var(--on-surface);
}
.sectionhead .msym{font-size:20px;color:var(--on-surface-variant)}
.sectionhead h2{margin:0;font-size:16px;font-weight:500;letter-spacing:.01em}

.card{
  background:var(--surface);border:1px solid var(--outline-variant);
  border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
  text-align:left;width:100%;transition:background .15s;
}
.card:hover{background:var(--surface-dim)}
.card.lead{grid-column:1/-1}
@media (min-width:720px){.card.lead{grid-column:span 2}}
@media (min-width:1080px){.card.lead{grid-column:span 2}}

.src{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--on-surface-variant)}
.favi{
  width:18px;height:18px;border-radius:4px;flex:none;color:#fff;
  font-size:10px;font-weight:700;display:grid;place-items:center;
}
.cardbody{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.cardrow{display:flex;gap:14px;align-items:flex-start}
.cardrow .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
h3.hl{
  margin:0;font-size:16px;line-height:1.45;font-weight:500;color:var(--on-surface);
  text-wrap:balance;
}
.card.lead h3.hl{font-size:19px;line-height:1.4}
.meta{font-size:12px;color:var(--on-surface-faint)}
.thumb{border-radius:12px;overflow:hidden;position:relative;flex:none;display:grid;place-items:center}
.thumb.sq{width:88px;height:88px}
.thumb.wide{width:100%;aspect-ratio:16/9;border-radius:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .msym{color:rgba(255,255,255,.92);font-size:34px}
.thumb.wide .msym{font-size:56px}
.cardacts{
  display:flex;align-items:center;gap:4px;padding:2px 8px 8px 8px;
  border-top:1px solid transparent;
}
.iconbtn{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  color:var(--on-surface-variant);transition:background .15s;
}
.iconbtn:hover{background:var(--ripple)}
.iconbtn .msym{font-size:20px}
.iconbtn.active{color:var(--primary)}
.spacer{flex:1}

/* rank table */
.ranktable{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.ranktable th,.ranktable td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--outline-variant)}
.ranktable th{font-weight:500;color:var(--on-surface-variant);font-size:12px}
.ranktable td:first-child{font-variant-numeric:tabular-nums;width:44px;color:var(--on-surface-variant)}
.ranktable tr:first-child td{font-weight:500}

/* ---------- article ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--surface);
  display:flex;align-items:center;gap:4px;padding:6px 8px;height:56px;
  border-bottom:1px solid transparent;
}
.topbar.scrolled{border-bottom-color:var(--outline-variant)}
.article{padding:0 0 96px;max-width:720px;margin:0 auto;width:100%}
.article .inner{padding:8px 20px 0}
.srcrow{display:flex;align-items:center;gap:10px;padding:12px 0 16px}
.srcrow .name{font-size:14px;font-weight:500}
.srcrow .favi{width:28px;height:28px;border-radius:8px;font-size:13px}
.follow{
  margin-left:auto;border:1px solid var(--outline-variant);border-radius:20px;
  padding:7px 16px;font-size:13px;font-weight:500;color:var(--primary);
}
.follow.on{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent}
h1.ahl{margin:0 0 12px;font-size:24px;line-height:1.42;font-weight:500;text-wrap:balance}
.abyline{font-size:12px;color:var(--on-surface-faint);margin-bottom:18px}
.ahero{width:100%;aspect-ratio:16/9;display:grid;place-items:center;border-radius:16px;margin-bottom:20px;overflow:hidden}
.ahero img{width:100%;height:100%;object-fit:cover;display:block}
.ahero .msym{font-size:64px;color:rgba(255,255,255,.92)}
.alead{font-size:16px;line-height:1.85;font-weight:500;margin:0 0 18px}
.abody p{font-size:15px;line-height:1.95;margin:0 0 16px;color:var(--on-surface)}
.acomments{margin-top:28px;border-top:1px solid var(--outline-variant);padding-top:18px}
.acomments h4{margin:0 0 12px;font-size:13px;font-weight:500;color:var(--on-surface-variant)}
.cmt{display:flex;gap:10px;padding:9px 0;font-size:13px;color:var(--on-surface-variant);line-height:1.7}
.cmt .msym{font-size:18px;color:var(--on-surface-faint);flex:none;margin-top:2px}
.fictionnote{
  margin-top:28px;padding-top:14px;border-top:1px solid var(--outline-variant);
  font-size:11px;line-height:1.7;color:var(--on-surface-faint);
}

/* ---------- search ---------- */
.searchfield{
  display:flex;align-items:center;gap:8px;flex:1;height:48px;
  background:var(--surface-container);border-radius:24px;padding:0 8px 0 8px;
}
.searchfield input{
  flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:15px;
  color:var(--on-surface);
}
.searchfield input::placeholder{color:var(--on-surface-variant)}
.sugg{padding:8px 0 96px;max-width:720px;margin:0 auto;width:100%}
.suggrow{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  padding:12px 20px;font-size:15px;color:var(--on-surface);transition:background .15s;
}
.suggrow:hover{background:var(--surface-container)}
.suggrow .msym{font-size:20px;color:var(--on-surface-variant);flex:none}
.suggrow b{font-weight:700}
.results{padding:8px 8px 96px;max-width:1120px;margin:0 auto;width:100%}
.resulthead{padding:12px 12px 4px;font-size:12px;color:var(--on-surface-faint)}
.empty{padding:56px 32px;text-align:center;color:var(--on-surface-variant)}
.empty .msym{font-size:44px;color:var(--on-surface-faint);margin-bottom:12px}
.empty p{margin:6px 0;font-size:14px;line-height:1.8}
.aioverview{
  background:var(--surface-container);border-radius:16px;padding:16px 18px;margin:8px 4px 16px;
}
.aioverview .lbl{
  display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;
  color:var(--primary);margin-bottom:10px;
}
.aioverview .lbl .msym{font-size:18px}
.aioverview p{margin:0 0 10px;font-size:14px;line-height:1.9;color:var(--on-surface)}
.aioverview .disc{font-size:11px;color:var(--on-surface-faint);margin:0}

/* ---------- bottom nav ---------- */
.navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface-container);
  display:flex;justify-content:space-around;align-items:center;
  height:80px;padding-bottom:env(safe-area-inset-bottom);
  border-top:1px solid var(--outline-variant);
}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;padding-top:12px;height:100%}
.navitem .pill{
  width:64px;height:32px;border-radius:16px;display:grid;place-items:center;
  transition:background .15s;
}
.navitem[aria-selected="true"] .pill{background:var(--secondary-container)}
.navitem[aria-selected="true"] .msym{color:var(--on-secondary-container)}
.navitem[aria-selected="true"] .lb{color:var(--on-surface);font-weight:500}
.navitem .msym{font-size:22px;color:var(--on-surface-variant)}
.navitem .lb{font-size:11px;color:var(--on-surface-variant)}

/* ---------- staff sheet ---------- */
.scrim{
  position:fixed;inset:0;background:var(--scrim);z-index:40;display:none;
}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--surface-container);border-radius:28px 28px 0 0;
  padding:12px 24px calc(28px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;transform:translateY(100%);
  transition:transform .25s cubic-bezier(.2,0,0,1);
  max-height:86dvh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.grabber{width:32px;height:4px;border-radius:2px;background:var(--outline-variant);margin:0 auto 18px}
.sheet h3{margin:0 0 4px;font-size:16px;font-weight:500}
.sheet .sub{margin:0 0 18px;font-size:13px;color:var(--on-surface-variant);line-height:1.7}
.segmented{display:flex;border:1px solid var(--on-surface-variant);border-radius:20px;overflow:hidden}
.segmented button{
  flex:1;padding:10px 8px;font-size:13px;font-weight:500;color:var(--on-surface);
  display:flex;align-items:center;justify-content:center;gap:6px;
  border-right:1px solid var(--on-surface-variant);transition:background .15s;
}
.segmented button:last-child{border-right:0}
.segmented button[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container)}
.segmented button .msym{font-size:18px}
.loopnote{
  margin-top:16px;font-size:12.5px;line-height:1.85;color:var(--on-surface-variant);
  background:var(--surface);border-radius:12px;padding:14px 16px;
}
.loopnote b{color:var(--on-surface);font-weight:500}
.sheet .close{
  margin-top:20px;width:100%;padding:12px;border-radius:20px;
  background:var(--primary);color:var(--on-primary);font-weight:500;font-size:14px;
}

/* ---------- 大学サイト ---------- */
.uni{max-width:960px;margin:0 auto;width:100%;padding-bottom:96px}
.unibar{display:flex;align-items:center;gap:14px;padding:18px 20px 14px}
.unilogo{width:44px;height:auto;flex:none;filter:invert(var(--logo-invert))}
.uniname{display:flex;flex-direction:column;line-height:1.25}
.uniname b{font-size:17px;font-weight:700;letter-spacing:.04em}
.uniname span{font-size:9.5px;letter-spacing:.14em;color:var(--on-surface-faint)}
.unitop{margin-left:auto;display:flex;gap:14px;font-size:11px;color:var(--on-surface-variant)}
@media (max-width:560px){.unitop{display:none}}
.uninav{
  display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  border-top:1px solid var(--outline-variant);border-bottom:1px solid var(--outline-variant);
}
.uninav::-webkit-scrollbar{display:none}
.uninav span{
  flex:none;padding:13px 18px;font-size:13px;font-weight:500;color:var(--on-surface);
  border-right:1px solid var(--outline-variant);white-space:nowrap;
}
.unihero{
  background:var(--uni-band);padding:40px 24px 44px;margin-bottom:8px;
  border-bottom:3px solid var(--uni-accent);
}
.unihero .eyebrow{
  margin:0 0 10px;font-size:11px;letter-spacing:.18em;color:var(--uni-accent);font-weight:700;
}
.unihero h2{margin:0;font-size:27px;line-height:1.4;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.unihero p.sub{margin:14px 0 0;font-size:13.5px;line-height:1.9;color:var(--on-surface-variant);max-width:44em}
.unisec{padding:26px 24px 8px}
.unisec h3{
  margin:0 0 4px;font-size:15px;font-weight:700;letter-spacing:.06em;
  padding-bottom:10px;border-bottom:2px solid var(--on-surface);display:inline-block;
}
.unilist{list-style:none;margin:6px 0 0;padding:0}
.unilist li{
  display:flex;gap:14px;align-items:baseline;padding:13px 2px;
  border-bottom:1px solid var(--outline-variant);font-size:13.5px;line-height:1.7;
}
.unilist .tag{
  flex:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--uni-accent);
  border:1px solid var(--uni-accent);border-radius:3px;padding:2px 7px;
}
.unitiles{display:grid;gap:12px;grid-template-columns:1fr;padding:20px 24px 8px}
@media (min-width:640px){.unitiles{grid-template-columns:1fr 1fr 1fr}}
.unitile{
  border:1px solid var(--outline-variant);border-left:4px solid var(--uni-accent);
  padding:16px 18px;
}
.unitile b{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.unitile span{font-size:12.5px;line-height:1.8;color:var(--on-surface-variant)}
.unifoot{
  margin-top:28px;border-top:1px solid var(--outline-variant);padding:20px 24px;
  font-size:11.5px;line-height:2;color:var(--on-surface-faint);
}
.webresult{
  display:flex;gap:14px;align-items:center;width:100%;text-align:left;
  border:1px solid var(--outline-variant);border-radius:16px;padding:14px 16px;
  margin:4px 4px 14px;transition:background .15s;
}
.webresult:hover{background:var(--surface-dim)}
.webresult img{width:34px;height:auto;flex:none;filter:invert(var(--logo-invert))}
.webresult .wr{flex:1;min-width:0}
.webresult .url{font-size:11.5px;color:var(--on-surface-faint);margin-bottom:2px}
.webresult .ttl{font-size:15px;font-weight:500;color:var(--primary);margin-bottom:4px}
.webresult .dsc{font-size:12.5px;line-height:1.7;color:var(--on-surface-variant)}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>

<div id="app">

  <!-- ========== FEED ========== -->
  <section class="view on" id="view-feed">
    <header class="appbar">
      <div class="searchbar" style="cursor:default">
        <button class="msym" id="openSearch" style="cursor:pointer" aria-label="検索">search</button>
        <span class="ph" id="openSearch2" role="button" tabindex="0">検索</span>
      </div>
    </header>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <main><div class="feedgrid" id="feed"></div></main>
  </section>

  <!-- ========== ARTICLE ========== -->
  <section class="view" id="view-article">
    <header class="topbar" id="artbar">
      <button class="iconbtn" id="artBack" aria-label="戻る"><span class="msym">arrow_back</span></button>
      <div class="spacer"></div>
      <button class="iconbtn" id="artSave" aria-label="保存"><span class="msym">bookmark</span></button>
      <button class="iconbtn" aria-label="共有"><span class="msym">share</span></button>
      <button class="iconbtn" aria-label="その他"><span class="msym">more_vert</span></button>
    </header>
    <div class="article" id="article"></div>
  </section>

  <!-- ========== SEARCH ========== -->
  <section class="view" id="view-search">
    <header class="topbar">
      <button class="iconbtn" id="srchBack" aria-label="戻る"><span class="msym">arrow_back</span></button>
      <div class="searchfield">
        <input id="q" type="search" placeholder="ニュースを検索" autocomplete="off" enterkeyhint="search" aria-label="ニュースを検索">
        <button class="iconbtn" id="qClear" aria-label="消去"><span class="msym">close</span></button>
      </div>
    </header>
    <div id="searchBody"></div>
  </section>

{id:1,loops:[1,2,3],cat:"テクノロジー",src:"NEXT NEWS",t:"1時間前",
 hl:"新型自律走行車、公道での「完全無人」運行を全面解禁",
 lead:"運転席そのものを持たない新型の自律走行車について、国内の主要都市での運行が今月から全面的に解禁された。市街地を含むすべての公道が対象となる。",
 body:["解禁されたのは、車内に運転装置を一切備えない完全自律型の車両。従来は決められた区間や時間帯に限って認められていたが、今月からは市街地の生活道路を含め、すべての公道での走行が可能になる。",
 "新型車両の特徴は、周囲の人の「意図」を読み取る点にある。歩行者の視線の向き、肩の傾き、足の踏み出し方といった細かな挙動から、道を渡ろうとしているのかどうかを判断し、減速するかどうかを決める。試験運行では、人が飛び出してから停止するまでの平均時間が、これまでの車両の三分の一以下に短縮されたという。",
 "利用者からは「乗り込んで行き先を言うだけでいい」「渋滞のときに人が運転しているより滑らかで酔わない」といった声が上がる一方、「誰も乗っていない車が横に並ぶと落ち着かない」という戸惑いの声も少なくない。",
 "運行事業者の担当者は「事故がゼロになるとは申し上げられません。ただ、判断のすべてが記録として残る点は、人が運転する車にはない安心だと考えています」と話している。"],
 cm:["タクシー代わりに使ってるけどもう戻れない","無人の車に道を譲られると妙にこわい","事故ったとき誰が謝るの？"]},

{id:2,loops:[1,2,3],cat:"テクノロジー",src:"NEXT NEWS",t:"2時間前",
 hl:"水道・電力・信号を一括制御　都市インフラ、AIが24時間「無人」で管理へ",
 lead:"上下水道、送電網、道路の信号制御をひとつの管理AIが統合して運用する仕組みが、国内の複数の都市で本格運用に入った。担当職員の常駐を前提としない運用は今回が初めてとなる。",
 body:["これまで、水道・電力・交通の各インフラは別々の事業者が個別に管理してきた。新しい仕組みでは、これらの状態をひとつの管理AIがまとめて把握し、需要の偏りや異常を検知した時点で自動的に配分を組み替える。",
 "たとえば、大規模な集会などで一部の地域に人が集中した場合、AIは信号の周期を先回りして変更し、同時にその地域への送電量を引き上げる。導入した都市では、停電が起きてから復旧するまでの平均時間が十数分から数十秒に短縮されたという。",
 "一方で、「人の判断が一度も入らないまま街が動くことへの不安」を指摘する声もある。運用主体は、緊急時には人が介入できる手順を残していると説明するが、実際にその手順が使われた例はまだ報告されていない。",
 "専門家は「便利さは疑いようがない。ただ、うまく動いている間は誰もその中身を見なくなる。それが一番こわい」と話す。"],
 cm:["停電が本当になくなった。もう戻れない","止まったときのことを誰か考えてる？","人が減った分の人件費どこ行った"]},

{id:3,loops:[1,2,3],cat:"健康",src:"日刊トレンド",t:"3時間前",
 hl:"話題沸騰！最新ハイテク豊胸技術で夢のOカップへ！！　施術はわずか15分",
 lead:"「切らない・腫れない・その日から普段どおり」。いま美容業界でもっとも注目を集めているのが、最新のハイテク豊胸だ。施術時間はわずか15分。しかも希望のサイズを事前にシミュレーションできるという。",
 body:["この技術の最大の特徴は、体に負担のかかる処置をいっさい行わない点にある。専用の装置を当てるだけで、自分の組織そのものにはたらきかけ、狙ったかたちに変えていくという仕組みだ。",
 "サイズは事前の画面上で細かく指定できる。担当者によると、最近もっとも多い希望は「Oカップ」。「上限はどこですか、と聞かれることが増えました。技術的にはもう少し上まで対応できます」と笑う。",

 "予約は数か月先まで埋まっている店舗もある。一方で、装置の性能に大きな差があるとして、事業者はカウンセリングを必ず受けるよう呼びかけている。"],
 cm:["15分は盛りすぎでは？と思ったら本当だった","Oカップって何。O？","元に戻せるのかだけ教えてほしい"]},

{id:4,loops:[1],cat:"健康",src:"WEEKLY VOICE",t:"5時間前",trend:true,
 hl:"119歳でも現役バリバリ！　激動の時代を生き抜いた高齢者の生活に迫る",
 lead:"「引退なんて、考えたこともない」。そう言って笑うのは、今年で119歳になる男性だ。いまも週の大半を仕事にあて、自分の足で歩き、自分の口で指示を出す。取材はご本人の希望により、氏名と写真を伏せる条件で行った。",
 body:["取材場所に指定されたのは、ベトナム南部の高層レジデンスの一室だった。窓の外には河と、びっしりと立ち並ぶビル。「ここに住んで長いよ」とだけ話す。",
 "生まれは、千葉県東金市。海と田んぼに囲まれた町で育った。若いころに日本を離れ、それ以来ずっと拠点は海外にある。故郷の話になると少しだけ言葉が短くなり、「もう知ってる人はいないからね」と続けた。",
 "長生きの秘訣をたずねると、返ってきたのは拍子抜けするほど地味な答えだった。「ヨガと、散歩。それだけ」。毎朝5時に起き、30分ほどヨガをする。そのあと、決まった道を1時間歩く。何十年も変えていないという。",
 "食事も特別なことはしていない。「多く食べない。よく噛む。腹が立ったまま食べない。それくらい」。健康法をいくつも試した時期もあったが、いまはこの三つに落ち着いたそうだ。",
 "「同い年の友達は、もういない」。そう言ったあと、少しの間があった。「長く生きるっていうのは、そういうことなんだよ。だから、いま隣にいる人を大事にしたほうがいい」",
 "その言葉のあと、彼はすぐに時計を見て立ち上がった。次の予定が入っているという。119歳の一日は、まだ半分も終わっていなかった。"],
 cm:["肌つやが完全に20代なんだが","ヨガと散歩でここまでいけるの？","最後の一言がずっと刺さってる","顔出しNGなの逆に気になる"]},

{id:5,loops:[1],cat:"健康",src:"WEEKLY VOICE",t:"7時間前",
 hl:"【独占】119歳、いまも現役。　「若者へ伝えたいこと」を聞いた",
 lead:"先日の記事で大きな反響を呼んだ、119歳の現役経営者。「若い人に何か伝えたいことはありますか」という読者からの質問が数多く寄せられたため、あらためて時間をいただいた。",
 body:["――若い人に伝えたいことはありますか。",
 "「お金は、やはり大事だよ。きれいごとを言う人もいるけどね、あれは持っている人が言うことだ。お金がなければ、行きたいところにも行けないし、食べたいものも食べられない。会いたい人にも会えない」",
 "――お金だけ、ということでしょうか。",
 "「そうは言っていない。時間の話をしている。経験が詰まっていない時間なんて、いくらあっても意味がないんだ。何もしないで過ごした一年と、何かをやりきった一日と、どっちが長いと思う？　私は後者だと思っている」",
 "――若いころ、後悔したことは。",
 "「たくさんあるよ。でも一番は、人の言うことを信じすぎたことだな。うまい話を持ってくる人間は、必ず自分の取り分を先に決めている。……だから、騙されないように、賢く生きろ。これだけは覚えておいたほうがいい」",
 "――いま、いちばん楽しいことは何ですか。",
 "「……そうだね」（しばらく黙ったあと）「次の予定があること、かな」",
 "取材の終わりに、部屋の写真を撮らせてほしいと頼むと、やんわりと断られた。「見せるほどのものはないよ」。そう言って、また時計を見た。",
 "以上、鵜沢向希さんへのインタビューでした！"],
 cm:["言ってることが重い","119歳に言われると説得力が違う","最後ちょっとさみしそうじゃない？"]},

{id:6,loops:[1,2,3],cat:"日本",src:"東関東新報",t:"9時間前",
 hl:"千葉・東金市で失踪相次ぐ　行方不明者15人に　県警が公開捜査へ",
 lead:"千葉県東金市とその周辺で、住民が相次いで行方不明になっている。県警はこれまでに15人の失踪を確認し、事件性が高いとみて公開捜査に踏み切った。犯人の特定には至っていない。",
 body:["県警によると、最初の届け出があったのは半年ほど前。以降、断続的に届け出が続き、行方が分からなくなっている人は15人にのぼる。年齢も性別も職業もばらばらで、いまのところ共通点は見つかっていない。",
 "いずれのケースでも、争ったあとや持ち物の紛失は確認されていない。数人は外出の直前まで家族と連絡を取っており、「すぐ戻る」と言い残したまま姿を消していた。",
 "捜査を難しくしているのが、映像の少なさだ。市内の防犯カメラには、失踪した人物が通ったはずの時間帯の記録が残っていない区間が複数あるという。県警はカメラの不具合と人為的な操作の両面から調べている。",
 "近隣住民からは不安の声が上がる。「夕方でも子どもを一人で歩かせないようにしている」「盆で人が増える時期なのに、これでは落ち着かない」。",
 "県警は、当時の目撃情報や車両の映像など、些細なことでも情報を寄せてほしいと呼びかけている。"],
 cm:["15人って多すぎない？","詳細が全然出てこないのが逆にこわい","お盆に帰省する予定だったんだけど"]},

{id:7,loops:[3],cat:"ビジネス",src:"NEXT NEWS",t:"4時間前",
 hl:"United Zillion Worldwide、時価総額で首位を独走　金融発、あらゆる分野へ",
 lead:"金融を中核に事業を広げてきた United Zillion Worldwide（ユナイテッド・ジリオン・ワールドワイド、以下UZW）が、国内企業の時価総額で首位を独走している。2位以下との差は開く一方で、単独で市場全体のかなりの部分を占める異例の状態が続く。",
 body:["UZWはもともと金融を主業とする企業だが、現在は物流、医療、教育、エネルギー、そしてメディアと、事業領域が重ならない分野にまで手を広げている。それぞれの分野で、参入からごく短い期間で上位に食い込んできた。",
 "決定的だったのは、長く金融界の競合とされたオリエンス・フィナンシャルグループの経営破綻だ。同社は相次ぐ不祥事の発覚と大口取引の失敗が重なって立ち行かなくなり、その後の市場はUZWが事実上独占する形となった。",
 "本社は、湾岸に建つ自社ビル「ジリオンタワー」。周囲のビルを見下ろす高さで、上層階には報道関係者も立ち入れない。",
 "創業者であり現在も社長を務める人物は、119歳。公の場に姿を見せることはほとんどなく、社内向けの映像を通じて発言するのみだという。",
 "「一つの企業がここまで多くの分野を握った例は思い当たらない」と、ある市場関係者は言う。「強いというより、負ける場面が見当たらない。それはそれで不自然です」"],
 cm:["もう国より大きくない？","就活の第一志望これ一択","潰れた会社の社員どこ行ったんだろ"]},

{id:8,loops:[3],cat:"エンタメ",src:"日刊トレンド",t:"2時間前",trend:true,
 hl:"ベトナム最大級のホテルを貸し切り　UZW社長の誕生日会、今年も豪華絢爛",
 lead:"United Zillion Worldwide の社長の誕生日を祝うパーティーが、ベトナム国内で最も大きなホテルを三日間貸し切って開かれた。招待客は各国の要人や著名人など数百人にのぼるとみられる。",
 body:["会場となったのは、ベトナム最大級とされる高層ホテル。全館が三日間にわたって貸し切られ、一般の宿泊予約は数か月前から受け付けが停止されていた。",
 "関係者によると、当日は河沿いに花火が打ち上げられ、専用に編成された楽団が演奏を担当。招待客には、その場でしか手に入らない記念品が配られたという。総額は公表されていない。",
 "社長本人は今年で119歳。壇上には短時間だけ姿を見せ、「今年も、私はまだ働くつもりです」と述べたと伝えられている。",
 "毎年恒例となっているこの誕生日会には、批判も少なくない。SNSでは「その規模のお金を回すべきところが他にあるのでは」「同じ国の人間として恥ずかしい」といった投稿が広がった。",
 "同社の広報は、費用はすべて社長個人の資産から支出されており、業務とは無関係であるとしている。"],
 cm:["三日間貸し切りって発想がもう違う","119歳でこの体力なんなんだ","毎年やってるのがすごい","もっと有意義に使ってくれ"]},

{id:9,loops:[3],cat:"ビジネス",src:"月刊アンダーライン",t:"12時間前",
 hl:"「United Zillion Worldwide　やばい」——検索が示す、消えない不正の影",
 lead:"United Zillion Worldwide は、金融をはじめさまざまな分野で最先端を行く企業だ。しかし、そのやり方には不自然な点も指摘され続けている。同社名を検索すると、必ず「やばい」「不正」といった語が並ぶのはなぜか。",
 body:["第一に、競合の消え方だ。同社が新たに参入した分野では、その直後に既存の有力企業が立て続けに不祥事を発覚させ、市場から退場している。時期の重なり方が偶然にしては整いすぎている、というのが複数の関係者の見方だ。",
 "第二に、情報の消え方だ。同社に批判的な投稿や動画は、拡散し始めた直後に非表示となる例が繰り返し確認されている。投稿者のアカウントごと消えることも珍しくない。一方で、同社と社長を称賛する内容は、驚くほど自然に多くの人の画面に届く。",
 "第三に、待遇の差だ。医療や生活支援のサービスにおいて、同社への貢献度によって受けられる内容が変わっているという証言が、複数の元従業員から寄せられている。本誌はその裏付けとなる内部文書の一部を確認した。",
 "取材に対し、同社は「事実無根であり、根拠のない中傷には法的措置を検討する」と回答した。取材の申し入れから回答までは、わずか11分だった。",
 "本誌はこの取材を続けている。読者の皆さまからの情報提供をお待ちしている。"],
 cm:["この記事いつまで残るかな","前に似た記事読んだけど消えてた","怖いから見るのやめとこ"]},

{id:10,loops:[3],cat:"ビジネス",src:"NEXT NEWS",t:"6時間前",
 hl:"国内企業　時価総額ランキング（最新）",
 lead:"主要市場に上場する国内企業の時価総額上位。首位は今期も United Zillion Worldwide。2位以下を大きく引き離した状態が続いている。",
 rank:[["1","United Zillion Worldwide","金融・複合"],["2","セントラル電機","電機"],["3","コウヨウ自動車","輸送用機器"],["4","トウキョウ・エナジー","電力・エネルギー"],["5","アオイ製薬","医薬品"],["6","シンワ物流ホールディングス","陸運"],["7","ミナト重工","機械"],["8","サクラ通信","情報・通信"],["9","ニホンバシ商事","卸売"],["10","ホクト食品","食料品"]],
 body:["首位の United Zillion Worldwide は、2位以下すべてを合計してもなお届かない規模となっている。金融を中核としながら、物流・医療・教育・エネルギー・メディアの各分野でも上位に位置しており、複数の業種にまたがって集計されるのは同社のみ。",
 "かつて上位を占めていた金融大手のオリエンス・フィナンシャルグループは、経営破綻により本ランキングから外れている。"],
 cm:[]},

{id:11,loops:[1,2,3],cat:"日本",src:"NEXT NEWS",t:"30分前",trend:true,
 hl:"記録的な猛暑続く　冷感日傘が全国で品切れ、生産追いつかず",
 lead:"各地で猛烈な暑さが続いている。屋外の体感温度を下げる冷感素材の日傘に注文が殺到し、主要メーカーはいずれも生産が追いついていない状況だ。",
 body:["この日傘は、日光を反射するだけでなく、生地そのものが周囲の熱を逃がす構造になっている。実測では、直射日光の下と比べて体感温度が7度前後下がるという。",
 "「朝の通勤で汗をかかなくなった。もう普通の傘には戻れない」と、都内で働く会社員は話す。街では、性別を問わず日傘を差す人の姿が当たり前になった。",
 "一方、供給は追いついていない。大手販売店では入荷のたびに数分で完売し、転売価格が定価の三倍を超える例も出ている。メーカー各社は「増産には数か月かかる」として、慌てて高額品を購入しないよう呼びかけている。",
 "気象当局は、今週いっぱい厳しい暑さが続くとみて、日中の外出を控えるよう注意を促している。"],
 cm:["値段が完全におかしくなってる","7度は盛ってるだろと思ってたら本当だった","去年買っといてよかった"]},

{id:12,loops:[1,2,3],cat:"スポーツ",src:"NEXT NEWS",t:"4時間前",
 hl:"無人判定システム、来季から全試合で導入へ　「誤審ゼロ」に現場は歓迎と戸惑い",
 lead:"プロリーグの運営機構は、判定をすべて無人システムに委ねる方式を、来季から全試合で導入すると発表した。人が判定に関わる場面は原則としてなくなる。",
 body:["導入されるのは、球場全体に配置されたセンサーが打球と選手の動きをすべて追跡し、判定を即座に表示する仕組み。判定結果は場内のスクリーンと観客の端末に同時に届く。",
 "試験導入した試合では、判定をめぐる抗議が一件も発生しなかった。運営側は「試合時間が平均で18分短縮された」と効果を強調する。",
 "現場の反応は割れている。あるベテラン選手は「揉めないのはいい。ただ、審判に食ってかかる監督を見られなくなるのは寂しい」と話した。長年審判を務めてきた関係者からは「正確さでは勝てない。それは認める」との声も聞かれた。",
 "運営機構は、システムが停止した場合に備え、有資格の審判員を各球場に待機させるとしている。"],
 cm:["誤審で負けるよりは百倍いい","抗議シーンが好きだったのに","18分短縮はでかい"]},

{id:13,loops:[1,2,3],cat:"ビジネス",src:"日刊トレンド",t:"6時間前",
 hl:"培養和牛の定食、チェーン店に登場　680円で「サシまで再現」",
 lead:"培養によってつくられた和牛肉を使った定食が、全国展開する定食チェーンで販売を始めた。価格は680円。発売初日から行列ができる店舗もあった。",
 body:["提供されているのは、赤身と脂の入り方を細かく設計した培養肉のステーキ定食。断面には、いわゆる「サシ」が実際の高級和牛と見分けがつかない形で入っている。",
 "同社によると、育てる部位を限定できるため、これまで捨てられていた部分が出ない。それが価格を抑えられた理由だという。",
 "記者も食べてみた。噛んだときの繊維の感じは確かに肉そのもので、脂の溶け方も自然だった。あえて言えば、後味がやや軽い。",
 "同社は「まずは食べ比べてほしい」として、今月中は通常の牛肉定食と食べ比べられるセットも用意している。"],
 cm:["680円で和牛の面してるのすごい","言われなければ絶対気づかない","後味が軽いの逆に好き"]},

{id:14,loops:[1,2,3],cat:"日本",src:"NEXT NEWS",t:"8時間前",
 hl:"新路線が開業　主要都市間を最短38分で結ぶ　初日の乗車率は9割超",
 lead:"先週開業した新路線の運行が本格的に始まった。主要都市間を最短38分で結び、初日の乗車率は9割を超えた。",
 body:["新路線は、地下深くを一直線に走る構造で、途中駅は二つのみ。走行中の揺れがほとんどなく、車内では立ったままでも飲み物をこぼさないという。",
 "実際に乗車した利用者からは「気づいたら着いていた」「移動のために早起きしなくてよくなった」といった声が上がった。",
 "沿線では、通勤圏が一気に広がったことで住宅需要が動き始めている。不動産関係者は「駅から離れた土地の問い合わせが先月から倍増している」と話す。",
 "運行事業者は、朝夕の混雑を受けて、来月から本数を1割増やす方針を明らかにした。"],
 cm:["38分は反則","引っ越しを本気で検討してる","揺れなさすぎて逆に落ち着かない"]},

{id:15,loops:[1,2,3],cat:"日本",src:"東関東新報",t:"昨日",
 hl:"みなと動物園のカワウソに三つ子　名前を一般公募へ",
 lead:"みなと動物園で飼育されているコツメカワウソに、三つ子の赤ちゃんが生まれた。同園での三つ子の誕生は初めてで、一般公開は来月を予定している。",
 body:["生まれたのは雄二頭と雌一頭。いずれも順調に育っており、体重はすでに生まれたときの倍を超えたという。",
 "飼育担当者は「母親が非常に落ち着いていて、三頭とも同じようにきちんと世話をしている。見ているこちらが安心します」と話す。",
 "同園は、三頭の名前を一般から募集する。応募は同園の窓口と公式サイトで受け付け、締め切りは今月末。決定した名前を応募した人には、飼育の様子を間近で見学できる招待券が贈られる。",
 "公開は来月上旬の予定。混雑が見込まれるため、当面は時間帯を区切った入れ替え制になるという。"],
 cm:["三つ子は反則的にかわいい","名前ぜったい応募する","入れ替え制でも行く"]},

{id:16,loops:[1,2,3],cat:"テクノロジー",src:"NEXT NEWS",t:"昨日",
 hl:"壁が季節で断熱を切り替える塗料、住宅に急速に普及　冷暖房費が半減の例も",
 lead:"外気温に応じて性質が変わる塗料を外壁に塗ることで、夏は熱を逃がし、冬は熱を閉じ込める——そんな住宅が急速に増えている。導入した家庭では冷暖房費が半減した例もある。",
 body:["この塗料は、一定の温度を境に内部の構造が変化し、熱を通しやすい状態と通しにくい状態を自動的に切り替える。電源も配線も不要で、既存の住宅にも上から塗るだけで施工できる。",
 "導入した家庭では、真夏の室温が塗る前より4度前後低くなったという報告が多い。ある家庭では、年間の冷暖房費が半分以下になったとしている。",
 "施工費は住宅一軒あたり数十万円程度。数年で元が取れる計算になるため、集合住宅への一括導入も進んでいる。",
 "一方、色の選択肢が限られる点は課題として残る。メーカーは「発色の幅を広げた製品を年内に出したい」としている。"],
 cm:["賃貸でもやってほしい","色が3種類しかないのがつらい","電気代が本当に減った"]},

{id:17,loops:[1,2,3],cat:"日本",src:"NEXT NEWS",t:"昨日",
 hl:"大学入試にAI面接官　導入校が半数を超える　「緊張しない」の声も",
 lead:"大学入試の面接をAIが担当する方式の導入が広がっている。全国の主要大学のうち、導入を決めた学校が半数を超えた。",
 body:["AI面接では、受験生が画面に向かって質問に答える。表情や声の調子ではなく、発言の内容と構成のみを評価するとされ、評価の根拠は後から本人にも開示される。",
 "受験生からは「相手の顔色をうかがわなくていいので緊張しない」「不合格の理由が分かるのはありがたい」といった声が上がる。",
 "一方、教育関係者からは慎重な意見も出ている。ある高校教員は「答えの型を練習した子が有利になっていないか、検証が必要だ」と指摘する。",
 "導入校の多くは、最終段階では人による面接を残すとしており、完全な置き換えには至っていない。"],
 cm:["不合格の理由が分かるのは大きい","対策本がもう出てるらしい","人と話す練習はどこでするんだ"]},

{id:18,loops:[1,2,3],cat:"エンタメ",src:"日刊トレンド",t:"昨日",
 hl:"名作映画の全編リメイク公開へ　「作り直す必要があったのか」賛否割れる",
 lead:"多くのファンを持つ名作映画が、全編を作り直した形で公開されることが決まった。発表直後からSNS上で賛否が分かれ、大きな話題となっている。",
 body:["公開されるのは、当時の映像を一から作り直し、細部の描写や間の取り方まで手を入れた新版。監督は「原典への敬意は保ったまま、いま観て自然な形にした」と説明している。",
 "支持する側は「暗くて見えなかった場面がやっと見える」「音の粗さが直っただけでも価値がある」と歓迎する。",
 "一方で反発も強い。「あの粗さこそが作品の味だった」「直したのではなく別物にしただけ」といった投稿が相次いだ。旧版の上映を求める署名も始まっている。",
 "配給側は、旧版も同時期に劇場公開する方針を示した。両方を見比べられる特別上映も企画されているという。"],
 cm:["両方やるならもう文句ない","あの粗さが好きだったんだよ","結局どっちも見に行くやつ"]},

{id:19,loops:[1,2,3],cat:"エンタメ",src:"WEEKLY VOICE",t:"2日前",
 hl:"「無音カフェ」が静かなブーム　会話禁止、通知もオフ",
 lead:"店内での会話を禁止し、端末の通知もすべて遮断する「無音カフェ」が、若い世代を中心に人気を集めている。予約が取れない店舗も出てきた。",
 body:["無音カフェでは、入店時に端末を預けるか、通知をすべて切ることが求められる。店内での会話は禁止。注文は紙に書いて渡す。",
 "利用者の多くは、勉強や読書のために訪れる。「気が散る要素が本当にゼロになる。二時間で一日分くらい進む」と、常連の学生は話す。",
 "運営者によると、開店当初は「ただ静かなだけの店」と見られていたが、口コミで広がり、いまでは週末の予約が一か月先まで埋まっているという。",
 "同様の店は各地に増えており、無音の図書室や無音のコワーキングスペースも登場している。"],
 cm:["通知を預けるのが一番効く","注文を紙に書くのが地味に楽しい","静かな場所にお金を払う時代"]},

{id:20,loops:[1,2,3],cat:"科学",src:"NEXT NEWS",t:"2日前",
 hl:"量子もつれ通信、長距離での実証に成功　「盗聴が原理的に不可能」",
 lead:"研究チームは、量子もつれを利用した通信を、これまでにない長距離で成立させることに成功したと発表した。原理上、第三者による盗聴が不可能な通信方式として注目されている。",
 body:["この方式では、離れた二地点にある粒子の状態が結び付いている性質を利用する。途中で誰かが観測すると、その時点で状態が変化するため、盗み見られたこと自体が必ず分かる。",
 "これまでは距離が延びるほど成功率が急激に落ちる点が課題だったが、研究チームは中継の仕組みを工夫することでこれを克服したという。",
 "研究者は「まだ実験室の延長です。ただ、通信の前提そのものを変えうる結果だとは思っています」と話す。",
 "実用化には、装置の小型化と運用コストの引き下げが必要で、当面は金融や行政など限られた用途からの導入が見込まれる。"],
 cm:["盗聴が不可能って字面が強すぎる","原理がまったく理解できない","学部の授業でやったやつだ"]},

{id:21,loops:[1,2,3],cat:"日本",src:"東関東新報",t:"2日前",
 hl:"配送ロボットが狙われる　中身を抜き取る被害が相次ぐ",
 lead:"歩道を走行する小型の配送ロボットから、荷物だけを抜き取る被害が各地で相次いでいる。事業者は防犯機能の強化を急いでいる。",
 body:["被害に遭ったのは、住宅街を自動で走行し、玄関先まで荷物を届ける小型ロボット。人通りの少ない時間帯に停止させられ、収納部分をこじ開けられる手口が確認されている。",
 "ロボットには映像を記録する機能があるが、顔を隠したうえで背後から近づく例が多く、特定には至っていない。",
 "事業者は、収納部分の施錠を強化するとともに、異常な停止を検知した際に周囲へ警告音を出す機能を追加した。",
 "警察は、被害額が小さくても必ず届け出るよう呼びかけている。"],
 cm:["こういうことする人が必ずいる","音が鳴るようにするしかない","配達員に戻すの？"]},

{id:22,loops:[1,2,3],cat:"日本",src:"東関東新報",t:"3日前",
 hl:"商店街最後の八百屋が閉店　無人店舗化さらに進む",
 lead:"駅前商店街で長く営業してきた八百屋が、今月末で店を閉じる。商店街に残る対面販売の店はこれでなくなり、すべてが無人店舗になる。",
 body:["この店は、家族三代にわたって同じ場所で営業してきた。店主は「体がきつくなったのが一番の理由。無人の店が悪いわけじゃない」と話す。",
 "商店街ではここ数年、無人店舗への切り替えが進んでいた。棚から商品を取って出るだけで会計が済み、営業時間の制約もない。",
 "一方、常連客からは惜しむ声が上がる。「今日は何がおいしいか聞ける場所がなくなる」「値段より、あの会話に来ていた」。",
 "閉店を前に、店の前には客からの手紙が貼り出されている。店主は「全部持って帰って、家で読みます」と笑った。"],
 cm:["聞ける相手がいなくなるのが痛い","無人は便利だけど寂しい","最終日ぜったい行く"]},

{id:23,loops:[1,2,3],cat:"健康",src:"日刊トレンド",t:"3日前",
 hl:"「置くだけ」睡眠測定枕、発売初日に完売　身に着ける必要なし",
 lead:"枕に頭を乗せるだけで睡眠の質を測定できる製品が発売され、初日で完売した。腕時計型のように身に着ける必要がないことが支持を集めている。",
 body:["この枕は、内部のセンサーが呼吸と寝返りを読み取り、眠りの深さを判定する。充電も不要で、電池の交換は年に一度程度で済むという。",
 "測定結果は端末に届き、寝つくまでの時間、深い眠りの割合、途中で目覚めた回数などが表示される。",
 "利用者からは「腕時計をつけて寝るのが苦手だったので助かる」「家族の分もほしい」といった声が上がった。",
 "メーカーは追加生産を決めたが、次回の入荷は来月中旬になる見込みだとしている。"],
 cm:["腕時計つけて寝るの無理だった民","結果を見て落ち込むまでがセット","枕の値段じゃない"]},

{id:24,loops:[1,2,3],cat:"科学",src:"NEXT NEWS",t:"4日前",
 hl:"軌道上ホテル、一般予約の受付を開始　三泊で「一生分の貯金」",
 lead:"地球を回る軌道上のホテルが、一般向けの予約受付を始めた。三泊の滞在で、費用は住宅が一軒買える水準になるという。",
 body:["客室は全部で十二室。窓は床から天井までの一枚ガラスで、九十分ごとに日の出と日の入りを見られるのが最大の売りだ。",
 "滞在前には数日間の訓練が必要で、健康状態の確認も行われる。運営会社によると、受付開始から数時間で年内の枠がすべて埋まった。",
 "利用者の多くは記念日での利用を予定しているという。運営会社の担当者は「泣きながら窓を見ている方が本当に多い。それを見るためにやっています」と話す。",
 "同社は、客室を増やした二棟目の建設にも着手しており、価格は現在の半分程度まで下げたいとしている。"],
 cm:["桁を数え間違えたかと思った","一生に一度でいいから行きたい","半額でも無理です"]},

{id:25,loops:[1,2,3],cat:"エンタメ",src:"日刊トレンド",t:"4日前",
 hl:"人気配信者が謝罪　投稿の「生成疑惑」めぐり　本人は一部を認める",
 lead:"登録者数の多い配信者が、自身の投稿に生成された素材を使っていたとして謝罪した。当初は否定していたが、指摘を受けて一部を認めた形だ。",
 body:["問題となったのは、旅先で撮影したとして投稿された一連の写真。細部の不自然さを指摘する声が上がり、検証が広がっていた。",
 "本人は当初「すべて自分で撮ったもの」と説明していたが、その後の配信で「一部、天候が悪かった日の写真を補ったものがあった」と説明し、頭を下げた。",
 "視聴者の反応は分かれている。「最初から言えばよかっただけ」という声がある一方、「そこまで責めることか」と擁護する意見も少なくない。",
 "本人は今後、素材に手を加えた場合は明記すると表明した。活動は継続するという。"],
 cm:["最初に言ってれば誰も怒ってない","見分けがつかないのが一番こわい","明記するなら別にいい"]},

/* ===== 追加分：カテゴリ均等化 ===== */

{id:26,loops:[1,2,3],cat:"ビジネス",src:"NEXT NEWS",t:"1時間前",
 hl:"大手小売、全店舗を「レジなし」に完全移行　滞在時間はむしろ伸びる",
 lead:"大手小売チェーンが、全国のすべての店舗からレジを撤去した。商品を手に取って店を出るだけで会計が済む方式に一本化する。",
 body:["同社はこれまで一部店舗で試験導入していたが、今月から全店に広げた。天井のセンサーと棚の重量計が商品の動きを追い、退店した時点で登録済みの決済手段から引き落とされる。",
 "会計の行列がなくなったことで、来店客の滞在時間は平均で4分伸びた。同社は「レジ待ちを嫌って買い足しをやめる人が多かった。その分が素直に売上に乗っている」と説明する。",
 "一方、現金しか使わない客への対応は課題として残る。同社は当面、有人の窓口を各店に一つだけ残すとしている。",
 "撤去したレジ担当の従業員は、品出しと接客に配置転換された。「聞かれることが増えた。前より店員らしい仕事をしている気がする」という声もある。"],
 cm:["出るだけで終わるの慣れると戻れない","現金派の親が困ってた","結局人は減ってないらしい"]},

{id:27,loops:[1,2,3],cat:"ビジネス",src:"NEXT NEWS",t:"5時間前",
 hl:"週休三日制、導入企業が2割を超える　「求人への応募が3倍になった」",
 lead:"週休三日制を導入した企業が全体の2割を超えたことが、業界団体の調査で分かった。人手不足の業種ほど導入が進んでいる。",
 body:["調査によると、導入企業の多くは給与を据え置いたまま労働日数を減らしている。生産性が落ちなかったと回答した企業は7割にのぼった。",
 "ある中堅メーカーの担当者は「求人への応募が3倍になった。採用にかけていた費用を考えれば、それだけで釣りが来る」と話す。",
 "一方、顧客対応が必要な業種では、曜日をずらして休む方式が主流だ。「全員が同じ日に休めないので、社内の連絡が回りにくくなった」という指摘もある。",
 "業界団体は、導入企業の追跡調査を続け、来期に詳細な結果を公表するとしている。"],
 cm:["応募3倍は分かる。自分も探してる","休みが増えても仕事量は同じでは","曜日ずらしだと結局出社してる"]},

{id:28,loops:[1,2,3],cat:"ビジネス",src:"日刊トレンド",t:"昨日",
 hl:"「経理まるごと自動化」サービスが急拡大　小さな会社ほど効果大",
 lead:"請求書の受け取りから仕訳、支払いまでを一括して自動処理するサービスの利用が、中小企業を中心に急速に広がっている。",
 body:["このサービスは、届いた請求書を読み取って内容を判定し、そのまま帳簿に反映して支払いまで実行する。担当者が確認するのは、判定に迷いがあった数件だけだ。",
 "利用している従業員十数人の会社では、月末に丸二日かかっていた作業が2時間に縮んだ。経理担当者は「数字を打つ仕事がなくなって、数字を見る仕事になった」と話す。",
 "提供会社によると、契約の8割は従業員50人未満の企業。専任の経理を置けない規模ほど効果が大きいという。",
 "誤った判定が残るリスクについては、修正した内容がすべて記録され、後から追える仕組みになっていると説明している。"],
 cm:["月末の地獄が消えた","小さい会社ほど効くのは本当","確認する人はやっぱり要る"]},

{id:29,loops:[1,2,3],cat:"ビジネス",src:"NEXT NEWS",t:"2日前",
 hl:"国内スタートアップの資金調達額、四半期で過去最高　上位は素材と物流",
 lead:"国内スタートアップが今四半期に調達した資金の総額が、四半期として過去最高を更新した。件数は横ばいで、一件あたりの規模が大きくなっている。",
 body:["調達額の上位を占めたのは、新素材と物流の分野だった。いずれも設備投資が重く、一度の調達額が大きくなりやすい。",
 "投資家側の関心も変わりつつある。「画面の中で完結する事業より、現実の物を動かす事業に資金が向かっている」と、あるファンドの担当者は分析する。",
 "一方、件数が伸びていないことを懸念する声もある。「大型化は選別が進んだ結果でもある。最初の一歩を踏み出せない起業家が増えていないか」との指摘だ。",
 "業界団体は、初期段階の資金供給を増やすための共同ファンド設立を検討している。"],
 cm:["素材が強いのは意外","一件が大きいだけで社数は増えてない","最初の調達が一番きつい"]},

{id:30,loops:[1,2,3],cat:"スポーツ",src:"NEXT NEWS",t:"2時間前",
 hl:"陸上で新記録が相次ぐ　シューズ規定の見直し議論へ",
 lead:"中長距離種目で記録の更新が相次いでいる。背景にシューズの進化があるとして、競技団体は規定の見直しに向けた議論を始めた。",
 body:["今季に入って、主要な大会で自己記録を更新した選手の割合が例年の倍近くに達している。特に反発力の高い素材を使ったシューズを履く選手に集中している。",
 "選手の受け止めは分かれる。ある実業団の選手は「道具の進化は競技の一部だと思う」と話す一方、別の選手は「同じ靴を履けない選手が不利になるのはおかしい」と語った。",
 "競技団体は、靴底の厚みと反発材の枚数について上限を設ける案を検討している。決定は来季の開幕前を目指す。",
 "過去にも、水着や用具の規定が記録の流れを変えた例がある。関係者は「どこまでを競技とするかの線引きの問題だ」と話す。"],
 cm:["靴で変わるのは事実","記録が並ぶと過去と比べられない","線引きは早めに決めてほしい"]},

{id:31,loops:[1,2,3],cat:"スポーツ",src:"日刊トレンド",t:"7時間前",
 hl:"eスポーツが正式種目に　競技人口はすでに野球を上回る",
 lead:"国内最大の総合競技大会で、eスポーツが正式種目として採用されることが決まった。国内の競技人口はすでに野球を上回っている。",
 body:["採用されるのは、対戦型の三種目。年齢別の部門が設けられ、上位入賞者には他競技と同じ表彰が行われる。",
 "競技団体によると、国内で継続的に大会に出場している人は野球の競技人口を超えた。地方では、部活動として取り入れる中学・高校も増えている。",
 "一方、練習環境の差を懸念する声もある。「回線と機材で結果が変わる競技を、公平に競わせられるのか」という指摘に対し、団体は会場の機材を全選手共通にすると説明している。",
 "初年度の参加枠は各地域の予選で決まる。予選の申し込みは来月から始まる。"],
 cm:["部活にあるのが普通になった","機材が揃ってるのはありがたい","親世代の理解がまだ追いつかない"]},

{id:32,loops:[1,2,3],cat:"スポーツ",src:"NEXT NEWS",t:"昨日",
 hl:"女子サッカー新リーグ、開幕戦が満員　中継の視聴も好調",
 lead:"今季発足した女子サッカーの新リーグが開幕した。開幕戦は全会場で観客席が埋まり、中継の視聴数も想定を大きく上回った。",
 body:["新リーグは、試合時間を平日の夜に集中させ、会場を駅から近い施設に絞ったのが特徴だ。「仕事帰りに寄れる」ことを最優先に設計したという。",
 "開幕戦を訪れた観客の4割が、女子サッカーの試合を初めて見た人だった。運営側は「入り口を広くする設計が効いた」と分析する。",
 "選手の待遇も改善された。全選手がリーグと直接契約し、他の仕事との兼業を前提としない体制になった。",
 "リーグは、今季の入場者数の目標を早くも上方修正した。"],
 cm:["駅近は本当に大きい","平日夜は行きやすい","この形が続いてほしい"]},

{id:33,loops:[1,2,3],cat:"スポーツ",src:"東関東新報",t:"3日前",
 hl:"高地トレーニング施設が都市部の地下に完成　標高3000m相当",
 lead:"標高3000m相当の環境を再現したトレーニング施設が、都市部の地下に完成した。移動せずに高地練習ができる施設としては国内最大となる。",
 body:["施設は地下三層構造で、フロアごとに酸素の濃度を変えられる。走路、プール、球技用のコートを備え、競技を問わず利用できる。",
 "これまで高地練習は海外の合宿地に長期滞在するのが一般的だった。運営者は「移動と滞在の費用がなくなる。学生や実業団の選手にとっては現実的な選択肢になる」と話す。",
 "利用には健康状態の確認が必要で、初回は必ず指導者の同行が求められる。",
 "一般の利用枠も設けられており、来月から予約の受け付けが始まる。"],
 cm:["合宿費が浮くのはでかい","一般枠あるの知らなかった","地下に3000mって字面が強い"]},

{id:34,loops:[1,2,3],cat:"科学",src:"NEXT NEWS",t:"3時間前",
 hl:"深海6000mで新種の発光生物　群れ全体で光を同期させる",
 lead:"深海6000m付近で、これまで確認されていなかった発光生物が見つかった。群れの個体が光の点滅を互いに合わせる性質を持つという。",
 body:["発見されたのは、体長数センチの半透明の生物。数十から数百の個体で群れをつくり、一定の間隔で青白い光を点滅させる。",
 "特徴的なのは、群れ全体の点滅がわずかな時間差で揃っていく点だ。研究チームは、隣の個体の光を感知して自分の周期を調整しているとみている。",
 "「何のために揃えるのかは分かっていません」と研究者は話す。「捕食者を惑わせるためか、仲間を見つけるためか。どちらとも説明がつきます」",
 "研究チームは、同じ海域で追加の調査を予定している。"],
 cm:["深海はまだ何も分かってない","揃うのが気持ち悪くて美しい","理由が分からないのがいい"]},

{id:35,loops:[1,2,3],cat:"科学",src:"NEXT NEWS",t:"9時間前",
 hl:"人工光合成、屋外での連続稼働に成功　燃料を「空気から」つくる",
 lead:"研究チームは、空気中の二酸化炭素と水から燃料をつくる人工光合成の装置を、屋外で連続して稼働させることに成功したと発表した。",
 body:["装置は、太陽光を受けて空気中の二酸化炭素を取り込み、液体の燃料に変える。これまでは実験室内での短時間の稼働にとどまっていた。",
 "今回は、天候の変化を含む屋外環境で三か月にわたって稼働を続けた。生産量は日照に左右されるものの、装置の性能低下はほとんど見られなかったという。",
 "研究者は「効率はまだ植物に及びません。ただ、植物と違って場所を選ばない点が強みです」と話す。",
 "実用化には規模の拡大が必要で、まずは離島や山間部での小規模な導入が検討されている。"],
 cm:["空気から燃料って字面がすごい","効率が上がれば化ける","三か月動いたのが本題だと思う"]},

{id:36,loops:[1,2,3],cat:"科学",src:"NEXT NEWS",t:"2日前",
 hl:"月の地下空洞に有人拠点　建設計画が最終段階へ",
 lead:"月面の地下に広がる空洞を利用した有人拠点の建設計画が、最終的な設計段階に入った。地表に建てるより放射線と温度差を避けやすいという。",
 body:["利用されるのは、かつての溶岩の通り道とみられる地下の空洞。直径は数十メートルあり、内部は温度の変化が小さいとされる。",
 "地表の拠点は、昼夜の温度差と放射線への対策に多くの資材を要する。地下ならその大部分を岩盤に任せられるため、運ぶ物資を大きく減らせる。",
 "課題は入口の確保だ。空洞に至る縦穴は不安定で、崩落を防ぐ補強が必要になる。計画では、まず無人の機械だけを送り込んで補強を終える。",
 "最初の滞在は、少人数で短期間から始める予定だという。"],
 cm:["地下に住むのが正解なの意外","縦穴の補強が一番大変そう","運ぶ量が減るのが効くのか"]},

{id:37,loops:[1,2,3],cat:"テクノロジー",src:"日刊トレンド",t:"30分前",

const TABS = ["おすすめ","日本","ビジネス","テクノロジー","エンタメ","スポーツ","科学","健康"];

/* ---------------- state ---------------- */
const S = {loop:1, tab:"おすすめ", nav:"home", selectedSrc:null, saved:new Set(), followed:new Set(), article:null};
try{
  const gameLoop = localStorage.getItem("game_loop");
  const raw = localStorage.getItem("newsprop");
  if(gameLoop) S.loop = Number(gameLoop) || 1;
  else if(raw){const o=JSON.parse(raw); if(o.loop) S.loop=o.loop; if(o.saved) S.saved=new Set(o.saved);}
  if(raw){const o=JSON.parse(raw); if(o.saved) S.saved=new Set(o.saved);}
}catch(e){}
function persist(){
  try{
    localStorage.setItem("newsprop",JSON.stringify({loop:S.loop,saved:[...S.saved]}));
    localStorage.setItem("game_loop", String(S.loop));
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'LOOP_CHANGE', loop: S.loop }, '*');
    }
  }catch(e){}
}
const live = () => A.filter(a => a.loops.includes(S.loop));
function mins(t){
  if(t === "昨日") return 1440;
  let m = t.match(/^(\d+)分前$/);        if(m) return Number(m[1]);
  m = t.match(/^(\d+)時間前$/);          if(m) return Number(m[1]) * 60;
  m = t.match(/^(\d+)日前$/);            if(m) return Number(m[1]) * 1440;
  return 99999;
}
const byId = id => A.find(a => a.id === id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- rendering helpers ---------------- */
function thumb(a, wide){
  const c = CAT[a.cat];
  const src = IMG[a.id];
  return `<div class="thumb ${wide?"wide":"sq"}" style="background:${c.g}">${
    src ? `<img src="${src}" alt="" loading="lazy" decoding="async">`
        : `<span class="msym">${c.i}</span>`}</div>`;
}
function srcline(a){
  const s = SRC[a.src];
  return `<div class="src"><span class="favi" style="background:${s.c}">${s.a}</span>${esc(a.src)}</div>`;
}
function cardHTML(a, lead){
  const acts = `<div class="cardacts">
      <div class="spacer"></div>
      <span class="iconbtn ${S.saved.has(a.id)?"active":""}" data-save="${a.id}"><span class="msym">${S.saved.has(a.id)?"bookmark":"bookmark_border"}</span></span>
      <span class="iconbtn"><span class="msym">share</span></span>
      <span class="iconbtn"><span class="msym">more_vert</span></span>
    </div>`;
  if(lead){
    return `<button class="card lead" data-open="${a.id}">
      ${thumb(a,true)}
      <div class="cardbody">${srcline(a)}<h3 class="hl">${esc(a.hl)}</h3><div class="meta">${esc(a.t)}</div></div>
      ${acts}</button>`;
  }
  return `<button class="card" data-open="${a.id}">
    <div class="cardbody"><div class="cardrow"><div class="txt">
      ${srcline(a)}<h3 class="hl">${esc(a.hl)}</h3><div class="meta">${esc(a.t)}</div>
    </div>${thumb(a,false)}</div></div>
    ${acts}</button>`;
}

/* ---------------- feed ---------------- */
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(t=>
    `<button class="tab" role="tab" aria-selected="${t===S.tab}" data-tab="${t}">${t}</button>`).join("");
}
function renderFeed(){
  const feed = document.getElementById("feed");
  let list = live();

  if(S.nav === "saved"){
    list = list.filter(a=>S.saved.has(a.id));
    feed.innerHTML = list.length
      ? `<div class="sectionhead"><span class="msym">bookmark</span><h2>保存済み</h2></div>` + list.map(a=>cardHTML(a,false)).join("")
      : `<div class="empty" style="grid-column:1/-1"><div class="msym">bookmark_border</div><p>保存した記事はまだありません</p><p style="font-size:13px">記事のブックマークを押すとここに表示されます。</p></div>`;
    return;
  }
  if(S.nav === "follow"){
    if (S.selectedSrc) {
      const sArticles = live().filter(a => a.src === S.selectedSrc).sort((x,y)=> mins(x.t) - mins(y.t));
      const sInfo = SRC[S.selectedSrc];
      let h = `
        <div class="sectionhead" style="display:flex; align-items:center; gap:8px;">
          <button class="iconbtn" id="srcBackBtn" style="margin-right:4px;"><span class="msym">arrow_back</span></button>
          <span class="favi" style="background:${sInfo.c}; width:24px; height:24px; border-radius:6px; font-size:12px;">${sInfo.a}</span>
          <h2 style="margin:0;">${esc(S.selectedSrc)}</h2>
          <span style="font-size:12px; color:var(--on-surface-variant); margin-left:auto;">${sArticles.length} 件の記事</span>
        </div>
      `;
      if (sArticles.length > 0) {
        h += cardHTML(sArticles[0], true);
        h += sArticles.slice(1).map(a => cardHTML(a, false)).join("");
      } else {
        h += `<div class="empty" style="grid-column:1/-1"><p>現在配信中の記事はありません</p></div>`;
      }
      feed.innerHTML = h;
      return;
    }

    const srcs = Object.keys(SRC);
    feed.innerHTML = `<div class="sectionhead"><span class="msym">bookmarks</span><h2>フォロー中の情報源</h2></div>` +
      srcs.map(s => {
        const sArticles = live().filter(a => a.src === s).sort((x,y)=> mins(x.t) - mins(y.t));
        const latestHl = sArticles.length > 0 ? sArticles[0].hl : "新着記事なし";
        const isFlw = S.followed.has(s);
        return `
          <button class="card" data-src-select="${esc(s)}" style="cursor:pointer;">
            <div class="cardbody">
              <div class="cardrow">
                <div class="txt">
                  <div class="src" style="display:flex; align-items:center; gap:8px;">
                    <span class="favi" style="background:${SRC[s].c}">${SRC[s].a}</span>
                    <span style="font-weight:700; font-size:14px; color:var(--on-surface);">${esc(s)}</span>
                    <span style="font-size:11px; color:var(--primary); background:var(--primary-container); padding:2px 8px; border-radius:10px; margin-left:auto;">${sArticles.length}件</span>
                  </div>
                  <h3 class="hl" style="font-size:14px; margin-top:4px; color:var(--on-surface-variant); line-height:1.4;">最新: ${esc(latestHl)}</h3>
                  <div class="meta" style="color:var(--primary); font-weight:500;">タップしてこの情報源の記事を読む ➔</div>
                </div>
              </div>
            </div>
          </button>
        `;
      }).join("");
    return;
  }

  if(S.tab !== "おすすめ") list = list.filter(a=>a.cat===S.tab);
  list = [...list].sort((x,y)=> mins(x.t) - mins(y.t));
  if(S.nav === "foryou") list.sort((x,y)=> (y.trend?1:0)-(x.trend?1:0));

  if(!list.length){
    feed.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="msym">newspaper</div><p>このカテゴリの記事はありません</p></div>`;
    return;
  }
  const head = S.nav==="foryou"
    ? `<div class="sectionhead"><span class="msym">star</span><h2>あなたへのおすすめ</h2></div>`
    : `<div class="sectionhead"><span class="msym">trending_up</span><h2>トップニュース</h2></div>`;
  const rest = list.slice(1);
  let html = head + cardHTML(list[0], true);
  if(rest.length > 4){
    html += rest.slice(0,4).map(a=>cardHTML(a,false)).join("");
    html += `<div class="sectionhead"><span class="msym">newspaper</span><h2>ほかのニュース</h2></div>`;
    html += rest.slice(4).map(a=>cardHTML(a,false)).join("");
  }else{
    html += rest.map(a=>cardHTML(a,false)).join("");
  }
  feed.innerHTML = html;
}

/* ---------------- article ---------------- */
function openArticle(id){
  const a = byId(id); if(!a) return;
  S.article = id;
  logActionToParent("BROWSER_ARTICLE_VIEW", `記事閲覧: ${a.hl}`);
  const c = CAT[a.cat], s = SRC[a.src];
  const rank = a.rank ? `<table class="ranktable"><tr><th>順位</th><th>企業名</th><th>業種</th></tr>` +
    a.rank.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("") + `</table>` : "";
  document.getElementById("article").innerHTML = `
    <div class="inner">
      <div class="srcrow">
        <span class="favi" style="background:${s.c}">${s.a}</span>
        <span class="name">${esc(a.src)}</span>
        <button class="follow ${S.followed.has(a.src)?"on":""}" data-follow="${esc(a.src)}">${S.followed.has(a.src)?"フォロー中":"フォロー"}</button>
      </div>
      <h1 class="ahl">${esc(a.hl)}</h1>
      <div class="abyline">${esc(a.cat)} ・ ${esc(a.t)}</div>
      <div class="ahero" style="background:${c.g}">${
        IMG[a.id] ? `<img src="${IMG[a.id]}" alt="">` : `<span class="msym">${c.i}</span>`}</div>
      <p class="alead">${esc(a.lead)}</p>
      ${rank ? `<div style="overflow-x:auto">${rank}</div><div style="height:18px"></div>` : ""}
      <div class="abody">${a.body.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
      ${a.cm && a.cm.length ? `<div class="acomments"><h4>コメント ${a.cm.length}</h4>${
        a.cm.map(t=>`<div class="cmt"><span class="msym">account_circle</span><span>${esc(t)}</span></div>`).join("")}</div>` : ""}
      <p class="fictionnote">この記事はイベント用に制作されたフィクションです。実在の人物・団体・事件とは関係ありません。</p>
    </div>`;
  const sv = document.getElementById("artSave");
  sv.classList.toggle("active", S.saved.has(id));
  sv.querySelector(".msym").textContent = S.saved.has(id) ? "bookmark" : "bookmark_border";
  show("article");
  window.scrollTo(0,0);
}

const SUGGEST_BASE = ["自律走行車","培養和牛","無音カフェ","冷感日傘","軌道上ホテル","量子もつれ通信","カワウソ 三つ子","AI面接官"];
const norm = s => s.toLowerCase().replace(/[\s　　]/g,"");

function uzwAvailable(){ return S.loop === 3; }

function suggestFor(q){
  const n = norm(q);
  if(n.length < 3) return [];   // サジェストは3文字以上から
  const out = [];
  if(uzwAvailable() && ("unitedzillionworldwide".startsWith(n) || n.startsWith("uzw") || "ユナイテッドジリオン".includes(n) || "unitedzillionworldwide".includes(n))){
    out.push({t:"United Zillion Worldwide"});
    out.push({t:"United Zillion Worldwide　やばい"});
    out.push({t:"United Zillion Worldwide　不正"});
    out.push({t:"United Zillion Worldwide　社長"});
    out.push({t:"United Zillion Worldwide　株価"});
  }
  if("鵜沢向希".includes(q) || "うざわこうき".includes(n)){
    out.push({t:"鵜沢向希"});
    if(uzwAvailable()) out.push({t:"鵜沢向希　誕生日会"});
    else out.push({t:"鵜沢向希　119歳"});
  }
  if("千葉工業大学".includes(q) || "ちばこうぎょうだいがく".includes(n) || "千葉工大".includes(q)){
    out.push({t:"千葉工業大学"});
    out.push({t:"千葉工業大学　学部"});
    out.push({t:"千葉工業大学　入試"});
  }
  if("学友会執行委員会".includes(q) || "千葉工業大学 学友会執行委員会".includes(q)){
    out.push({t:"学友会執行委員会"});
    out.push({t:"千葉工業大学　学友会執行委員会"});
  }
  SUGGEST_BASE.forEach(t=>{ if(norm(t).includes(n) && out.length<8) out.push({t}); });
  live().forEach(a=>{ if(out.length<8 && norm(a.hl).includes(n)) out.push({t:a.hl.slice(0,26)}); });
  return out.slice(0,8);
}

function renderSuggest(q){
  const list = suggestFor(q);
  document.getElementById("searchBody").innerHTML =
    `<div class="sugg">` + list.map(s=>
      `<button class="suggrow" data-q="${esc(s.t)}"><span class="msym">search</span><span>${esc(s.t)}</span></button>`
    ).join("") + `</div>`;
}

function runSearch(q){
  const n = norm(q);
  if(n) logActionToParent("BROWSER_SEARCH", `ニュース検索: ${q}`);
  const body = document.getElementById("searchBody");
  if(!n){ renderSuggest(""); return; }

  // special: 学友会 → always 0 results + AI overview
  if(n.includes("学友会")){
    body.innerHTML = `<div class="results">
      <div class="aioverview">
        <div class="lbl"><span class="msym">auto_awesome</span>AI による概要</div>
        <p>${esc(GAKUYUKAI_AI[S.loop])}</p>
        <p class="disc">生成 AI は試験運用中です。内容は必ずご確認ください。</p>
      </div>
      <div class="empty">
        <div class="msym">search_off</div>
        <p>「${esc(q)}」に一致するニュース記事は見つかりませんでした。</p>
        <p style="font-size:13px">キーワードを変えるか、別の表記でお試しください。</p>
      </div>
      <div class="resulthead">ウェブサイト</div>
      ${webResultHTML()}
      </div>`;
    return;
  }

  const isUni = q.includes("千葉工業大学") || q.includes("千葉工大") || n.includes("it-chiba") || q.includes("ちばこうぎょう");

  let hits = live().filter(a =>
    norm(a.hl+a.lead+a.body.join("")+a.cat+a.src).includes(n));

  if(n.includes("鵜沢") || n.includes("うざわ") || n.includes("向希")){
    hits = live().filter(a => uzwAvailable() ? [8,7,9,10].includes(a.id) : [5,43,4,42].includes(a.id));
  }
  if(uzwAvailable() && (n.includes("zillion") || n.startsWith("uzw"))){
    const order = n.includes("やばい")||n.includes("不正") ? [9,7,10,8] : [7,8,10,9];
    hits = order.map(byId).filter(Boolean);
  }

  const web = isUni ? `<div class="resulthead">ウェブサイト</div>${webResultHTML()}` : "";
  body.innerHTML = hits.length
    ? `<div class="results">${web}<div class="resulthead">約 ${hits.length} 件の記事</div><div class="feedgrid">${
        hits.map(a=>cardHTML(a,false)).join("")}</div></div>`
    : `<div class="results">${web}<div class="empty"><div class="msym">search_off</div>
        <p>「${esc(q)}」に一致するニュース記事は見つかりませんでした。</p>
        <p style="font-size:13px">キーワードを変えるか、別の表記でお試しください。</p></div></div>`;
}

      <h3>お知らせ</h3>
      <ul class="unilist">${d.news.map(n=>`<li><span class="tag">${esc(n[0])}</span><span>${esc(n[1])}</span></li>`).join("")}</ul>
    </div>
    <div class="unitiles">${d.tiles.map(t=>`<div class="unitile"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></div>`).join("")}</div>
    <div class="unifoot">
      大学案内　｜　アクセス　｜　情報公開　｜　お問い合わせ<br>
      このページはイベント用に制作されたフィクションです。実在の教育機関の公式サイトではありません。
    </div>
   </div>`;
  show("site");
  window.scrollTo(0,0);
}

/* ---------------- staff sheet ---------------- */
const LOOPNOTES = {
1:`<b>1周目</b>：119歳の健康法記事とインタビューが読めます（孤独なトーン）。UZW関連はまだ世界に存在しません。<br>「学友会執行委員会」で検索 → 0件＋AI概要「<b>1年半前に解散</b>」。`,
2:`<b>2周目</b>：119歳の記事2本が、<b>少し明るいトーンの別バージョン</b>に差し替わります（見出しは同じ）。UZWはまだ存在しません。<br>「学友会執行委員会」で検索 → 0件＋AI概要「<b>1年半前に解散</b>」。`,
3:`<b>3周目</b>：119歳の記事2本が<b>消滅</b>し、代わりに UZW 関連4本（企業紹介・誕生日会・不正疑惑・時価総額）が出現します。<br>検索欄に「United Zillion」と入れるとサジェストに<b>「やばい」</b>が出ます。<br>「学友会執行委員会」で検索 → 0件＋AI概要「<b>35年前に解体</b>」。`
};
function renderLoopNote(){
  const note = document.getElementById("loopnote");
  if (note) note.innerHTML = LOOPNOTES[S.loop] || "";
  document.querySelectorAll("#loopseg button").forEach(b=>
    b.setAttribute("aria-pressed", String(Number(b.dataset.loop) === S.loop)));
}

/* ---------------- navigation ---------------- */
function show(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("on"));
  document.getElementById("view-"+v).classList.add("on");
  document.getElementById("navbar").style.display = (v==="feed") ? "flex" : "none";
}
function openSearch(){
  show("search");
  const q = document.getElementById("q");
  q.value = ""; renderSuggest("");
  setTimeout(()=>q.focus(),60);
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const t = e.target;
  const open = t.closest("[data-open]");
  const save = t.closest("[data-save]");
  const tab  = t.closest("[data-tab]");
  const nav  = t.closest("[data-nav]");
  const sug  = t.closest("[data-q]");
  const flw  = t.closest("[data-follow]");
  const loop = t.closest("[data-loop]");
  const site = t.closest("[data-site]");
  const srcSel = t.closest("[data-src-select]");
  const srcBack = t.closest("#srcBackBtn");

  if(save){ e.stopPropagation();
    const id = Number(save.dataset.save);
    S.saved.has(id) ? S.saved.delete(id) : S.saved.add(id);
    persist(); renderFeed(); return; }
  if(site){ openSite(); return; }
  if(open){ openArticle(Number(open.dataset.open)); return; }
  if(tab){ S.tab = tab.dataset.tab; renderTabs(); renderFeed(); window.scrollTo(0,0); return; }
  if(srcBack){
    S.selectedSrc = null;
    renderFeed(); window.scrollTo(0,0); return; }
  if(srcSel){
    S.selectedSrc = srcSel.dataset.srcSelect;
    renderFeed(); window.scrollTo(0,0); return; }
  if(nav){
    S.nav = nav.dataset.nav;
    S.selectedSrc = null;
    document.querySelectorAll("[data-nav]").forEach(b=>b.setAttribute("aria-selected", String(b===nav)));
    document.getElementById("tabs").style.display = (S.nav==="home"||S.nav==="foryou") ? "flex" : "none";
    renderFeed(); window.scrollTo(0,0); return; }
  if(sug){ const q = sug.dataset.q; document.getElementById("q").value = q; runSearch(q); return; }
  if(flw){ const s = flw.dataset.follow;
    S.followed.has(s) ? S.followed.delete(s) : S.followed.add(s);
    flw.classList.toggle("on", S.followed.has(s));
    flw.textContent = S.followed.has(s) ? "フォロー中" : "フォロー"; return; }
  if(loop){ S.loop = Number(loop.dataset.loop); persist(); renderLoopNote(); renderFeed(); return; }

  if(t.closest("#openSearch") || t.closest("#openSearch2")){ openSearch(); return; }
  if(t.closest("#openStaff")){ sheet(true); return; }
  if(t.closest("#closeSheet") || t.id === "scrim"){ sheet(false); return; }
  if(t.closest("#siteBack")){ show("search"); window.scrollTo(0,0); return; }
  if(t.closest("#artBack") || t.closest("#srchBack")){ show("feed"); return; }
  if(t.closest("#artSave")){
    const id = S.article; if(!id) return;
    S.saved.has(id) ? S.saved.delete(id) : S.saved.add(id);
    persist();
    const sv = document.getElementById("artSave");
    sv.classList.toggle("active", S.saved.has(id));
    sv.querySelector(".msym").textContent = S.saved.has(id) ? "bookmark" : "bookmark_border";
    renderFeed(); return; }
  if(t.closest("#qClear")){ const q=document.getElementById("q"); q.value=""; renderSuggest(""); q.focus(); return; }
});

document.getElementById("q").addEventListener("input", e => renderSuggest(e.target.value));
document.getElementById("q").addEventListener("keydown", e => {
  if(e.key === "Enter"){ e.preventDefault(); runSearch(e.target.value); e.target.blur(); }
});
document.getElementById("openSearch2").addEventListener("keydown", e => {
  if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openSearch(); }
});
function sheet(on){
  document.getElementById("sheet").classList.toggle("on", on);
  document.getElementById("scrim").classList.toggle("on", on);
}
window.addEventListener("scroll", ()=>{
  document.getElementById("artbar").classList.toggle("scrolled", window.scrollY > 4);
});


// 🔄 iPadOS本体の周回状態と完全同期
window.addEventListener("storage", e => {
  if (e.key === "game_loop" && e.newValue) {
    const l = Number(e.newValue) || 1;
    if (S.loop !== l) {
      S.loop = l;
      renderLoopNote();
      renderFeed();
    }
  }
});

window.addEventListener("message", e => {
  if (e.data && e.data.type === "LOOP_CHANGE" && e.data.loop) {
    const l = Number(e.data.loop) || 1;
    if (S.loop !== l) {
      S.loop = l;
      renderLoopNote();
      renderFeed();
    }
  }
});

function logActionToParent(action, msg) {
  try {
    if (window.parent && typeof window.parent.logWriteToGAS === 'function') {
      window.parent.logWriteToGAS(action, msg);
    }
  } catch (err) {}
}


// 👈 ブラウザ内スワイプ戻るジェスチャー（右スワイプで確実に1個前の画面に戻る）
let browserTouchStartX = 0;
let browserTouchStartY = 0;
let isBrowserSwiping = false;

window.addEventListener("touchstart", e => {
  if (e.touches && e.touches.length === 1) {
    browserTouchStartX = e.touches[0].clientX;
    browserTouchStartY = e.touches[0].clientY;
    isBrowserSwiping = true;
  }
}, { passive: true });

window.addEventListener("touchend", e => {
  if (!isBrowserSwiping || !e.changedTouches || e.changedTouches.length !== 1) return;
  isBrowserSwiping = false;
  const deltaX = e.changedTouches[0].clientX - browserTouchStartX;
  const deltaY = Math.abs(e.changedTouches[0].clientY - browserTouchStartY);

  // 水平右スワイプ（50px以上右へ、かつ縦スクロールよりも横方向が大きい）
  if (deltaX >= 50 && deltaX > deltaY * 1.3) {
    handleBrowserSwipeBack();
  }
}, { passive: true });

function handleBrowserSwipeBack() {
  if (document.getElementById("view-article").classList.contains("on")) {
    show("feed");
    window.scrollTo(0, 0);
  } else if (document.getElementById("view-site").classList.contains("on")) {
    show("search");
    window.scrollTo(0, 0);
  } else if (document.getElementById("view-search").classList.contains("on")) {
    show("feed");
    window.scrollTo(0, 0);
  } else if (S.selectedSrc) {
    S.selectedSrc = null;
    renderFeed();
    window.scrollTo(0, 0);
  } else if (S.nav !== "home") {
    S.nav = "home";
    S.selectedSrc = null;
    document.querySelectorAll("[data-nav]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.nav === "home")));
    document.getElementById("tabs").style.display = "flex";
    renderFeed();
    window.scrollTo(0, 0);
  } else if (S.tab !== "おすすめ") {
    S.tab = "おすすめ";
    renderTabs();
    renderFeed();
    window.scrollTo(0, 0);
  }
}

/* ---------------- init ---------------- */
renderTabs(); renderFeed(); renderLoopNote();
</script>
